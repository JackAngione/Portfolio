[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["full"] }
tower = "0.5.3"
http-body-util = "0.1.5"
mongodb = "3.9.1"
dotenvy = "0.15.7"
serde_json = "1.0.151"
rand = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
sha2 = "0.11.0"
hex = "0.4.3"
meilisearch-sdk = "0.33.0"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "aiff"] }
argon2 = { version = "0.5.3", features = ["std"] }
url = "2.5"
